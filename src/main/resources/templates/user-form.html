<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Spring Boot App</title>
    <link rel="stylesheet" type="text/css" th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}">
</head>
<body>
<div class="container">
    <div class="row justify-content-center mt-4">
        <div class="col-md-6">
            <div class="text-center mb-3"><h2>[[${pageTitle}]]</h2></div>

            <form th:action="@{/users/save}" method="post" th:object="${user}">
                <input type="hidden" th:field="*{id}">
                <div class="border border-secondary rounded p-4">

                    <div class="mb-3 row align-items-center">
                        <label class="col-sm-4 col-form-label">E-mail:</label>
                        <div class="col-sm-8">
                            <input type="email" th:field="*{email}" class="form-control" required minlength="8" maxlength="45"/>
                        </div>
                    </div>

                    <div class="mb-3 row align-items-center">
                        <label class="col-sm-4 col-form-label">First Name:</label>
                        <div class="col-sm-8">
                            <input type="text" th:field="*{firstName}" class="form-control" required minlength="2" maxlength="45"/>
                        </div>
                    </div>

                    <div class="mb-3 row align-items-center">
                        <label class="col-sm-4 col-form-label">Last Name:</label>
                        <div class="col-sm-8">
                            <input type="text" th:field="*{lastName}" class="form-control" required minlength="2" maxlength="45"/>
                        </div>
                    </div>

                    <div class="mb-3 row align-items-center">
                        <label class="col-sm-4 col-form-label">Password:</label>
                        <div class="col-sm-8">
                            <input type="password" th:field="*{password}" class="form-control" required minlength="5" maxlength="45"/>
                        </div>
                    </div>

                    <div class="mb-3 row align-items-center">
                        <label class="col-sm-4 col-form-label">Enabled:</label>
                        <div class="col-sm-8">
                            <input type="checkbox" th:field="*{enabled}" class="form-check-input"/>
                        </div>
                    </div>

                    <div class="text-center mt-3">
                        <button type="submit" class="btn btn-primary me-2">Save</button>
                        <a class="btn btn-secondary" th:href="@{/users}">Cancel</a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
